<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Hidayat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'editorial-black': '#0A0A0A', 'editorial-gray': '#E5E5E5' },
                    fontFamily: { 'body': ['Inter', 'sans-serif'], 'mono': ['Space Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-body h-screen flex items-center justify-center">

    <div class="bg-white p-10 border border-editorial-gray w-full max-w-md shadow-2xl">
        <h1 class="font-mono text-2xl font-bold mb-2 text-center text-editorial-black">SYSTEM LOGIN</h1>
        <p class="text-center text-gray-500 text-sm mb-8">Area Khusus Administrator</p>

        <!-- Pesan Error/Notifikasi -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 mb-4 text-sm text-center border {% if category == 'danger' %}bg-red-100 text-red-700 border-red-400{% else %}bg-green-100 text-green-700 border-green-400{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="flex flex-col gap-5">
            <div>
                <label class="block font-mono text-xs font-bold mb-2">USERNAME</label>
                <input type="text" name="username" required class="w-full border border-gray-300 p-3 focus:outline-none focus:border-editorial-black transition-colors" placeholder="Masukkan username">
            </div>
            <div>
                <label class="block font-mono text-xs font-bold mb-2">PASSWORD</label>
                <input type="password" name="password" required class="w-full border border-gray-300 p-3 focus:outline-none focus:border-editorial-black transition-colors" placeholder="Masukkan password">
            </div>
            <button type="submit" class="bg-editorial-black text-white font-mono font-bold py-3 mt-4 hover:bg-gray-800 transition-colors">
                LOGIN →
            </button>
        </form>
        
        <a href="/" class="block text-center mt-6 text-sm text-gray-500 hover:text-black">&larr; Kembali ke Beranda</a>
    </div>

</body>
</html>
