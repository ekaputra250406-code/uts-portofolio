<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { 'editorial-black': '#0A0A0A' }, fontFamily: { 'body': ['Inter', 'sans-serif'], 'mono': ['Space Mono', 'monospace'] } } } }
    </script>
</head>
<body class="bg-gray-100 font-body h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 border border-gray-200 shadow-xl w-full max-w-2xl">
        <h1 class="font-mono text-2xl font-bold mb-6">{{ action }} PROJECT</h1>
        
        <form method="POST" class="flex flex-col gap-4">
            <div>
                <label class="block font-mono text-xs font-bold mb-1">JUDUL PROJECT</label>
                <input type="text" name="title" value="{{ project.title if project else '' }}" required class="w-full border p-2 focus:border-black outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-mono text-xs font-bold mb-1">ROLE</label>
                    <input type="text" name="role" value="{{ project.role if project else '' }}" required class="w-full border p-2 focus:border-black outline-none">
                </div>
                <div>
                    <label class="block font-mono text-xs font-bold mb-1">TAHUN</label>
                    <input type="text" name="year" value="{{ project.year if project else '' }}" required class="w-full border p-2 focus:border-black outline-none">
                </div>
            </div>
            <div>
                <label class="block font-mono text-xs font-bold mb-1">DESKRIPSI</label>
                <textarea name="description" required rows="3" class="w-full border p-2 focus:border-black outline-none">{{ project.description if project else '' }}</textarea>
            </div>
            <div>
                <label class="block font-mono text-xs font-bold mb-1">TECH STACK (Pisahkan dengan koma)</label>
                <input type="text" name="tech_stack" value="{{ project.tech_stack if project else '' }}" required class="w-full border p-2 focus:border-black outline-none" placeholder="Python, Flask, SQLite">
            </div>
            
            <div class="flex gap-4 mt-4">
                <button type="submit" class="bg-editorial-black text-white px-6 py-3 font-mono font-bold hover:bg-gray-800">SIMPAN DATA</button>
                <a href="/admin" class="bg-gray-200 px-6 py-3 font-mono font-bold hover:bg-gray-300 text-center">BATAL</a>
            </div>
        </form>
    </div>
</body>
</html>
