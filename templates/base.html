<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Hidayat Eka Saputra</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'editorial-black': '#0A0A0A', 'editorial-white': '#FFFFFF', 'editorial-gray': '#E5E5E5' },
                    fontFamily: { 'heading': ['Anton', 'sans-serif'], 'body': ['Inter', 'sans-serif'], 'mono': ['Space Mono', 'monospace'] }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<!-- TAMBAHKAN flex flex-col min-h-screen DI BODY -->
<body class="bg-editorial-white text-editorial-black font-body antialiased selection:bg-editorial-black selection:text-editorial-white relative flex flex-col min-h-screen">

    <!-- CUSTOM CURSOR -->
    <div id="custom-cursor"></div>

    <!-- 1. STICKY NAVBAR -->
    <nav class="fixed top-0 left-0 w-full z-50 bg-editorial-white/90 backdrop-blur-md border-b border-editorial-gray flex justify-between items-center px-6 md:px-12 py-4">
        <a href="{{ url_for('home') }}" class="font-heading text-xl tracking-wider">HIDAYAT.</a>
        <ul class="hidden md:flex gap-8 font-mono text-xs tracking-widest font-bold">
            <li><a href="{{ url_for('about') }}" class="hover:text-cyan-500 transition-colors {% if request.path == '/about' %}text-cyan-500{% endif %}">ABOUT</a></li>
            <li><a href="{{ url_for('experience') }}" class="hover:text-cyan-500 transition-colors {% if request.path == '/experience' %}text-cyan-500{% endif %}">EXPERIENCE</a></li>
            <li><a href="{{ url_for('projects') }}" class="hover:text-cyan-500 transition-colors {% if request.path == '/projects' %}text-cyan-500{% endif %}">PROJECTS</a></li>
            <li><a href="{{ url_for('skills') }}" class="hover:text-cyan-500 transition-colors {% if request.path == '/skills' %}text-cyan-500{% endif %}">SKILLS</a></li>
            <li><a href="{{ url_for('contact') }}" class="hover:text-cyan-500 transition-colors {% if request.path == '/contact' %}text-cyan-500{% endif %}">CONTACT</a></li>
        </ul>
    </nav>

    <!-- KONTEN DINAMIS (Ubah jadi flex-grow agar mengisi ruang kosong) -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-editorial-black text-editorial-white pt-12 pb-8 px-6 md:px-12 relative overflow-hidden border-t border-gray-800">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="font-mono text-xs text-gray-500">
                &copy; 2025 HIDAYAT EKA SAPUTRA. All Rights Reserved.
            </div>
            <div class="flex flex-wrap justify-center gap-6 font-mono text-sm tracking-widest font-bold">
                <a href="https://github.com/ekaputra250406-code" target="_blank" class="hover-target hover:text-cyan-400 transition-colors">GITHUB</a>
                <a href="https://instagram.com/ekaputrraa" target="_blank" class="hover-target hover:text-cyan-400 transition-colors">INSTAGRAM</a>
                <a href="https://tiktok.com/@ekaputrraa" target="_blank" class="hover-target hover:text-cyan-400 transition-colors">TIKTOK</a>
            </div>
        </div>
    </footer>

    <!-- Panggil Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
